name: Build Desktop App

on:
  push:
    tags:
      - "v*"
  # Manual run: builds and verifies every installer without publishing a
  # release (the version and release steps only run for a v* tag).
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner images (not *-latest) so a GitHub image rollover can't
        # silently change the build host. The runner OS is only the build host;
        # the minimum OS users need is set by Electron (macOS 11+, Windows 10+).
        # Linux stays on the oldest supported LTS: an AppImage only runs on
        # distros with a glibc at least as new as the one it was built against.
        # mac-arm64 is on macos-15: both arm64 DMGs built on macos-26
        # (v3.0.0-beta8, beta9) came out corrupted ("image data corrupted" on
        # open) while the same build on a local Mac gives a valid image.
        # mac-x64 is on macos-15-intel: on macos-26-intel electron-builder's
        # signing keychain setup fails (set-key-partition-list, SecKeychainUnlock).
        include:
          - os: windows-2025
            platform: win
            arch: --x64
          - os: macos-15
            platform: mac-arm64
            arch: --arm64
          - os: macos-15-intel
            platform: mac-x64
            arch: --x64
          - os: ubuntu-24.04
            platform: linux
            arch: --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build sidecar binary
        working-directory: api
        run: pyinstaller pilotbase-api.spec

      - name: Smoke test sidecar
        shell: bash
        working-directory: api
        run: |
          export ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          export SECRET_KEY=smoketest-secret
          BIN="dist/pilotbase-api/pilotbase-api"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="dist/pilotbase-api/pilotbase-api.exe"; fi
          "$BIN" --host 127.0.0.1 --port 0 --token smoketest --data-dir "$RUNNER_TEMP/pb-data" > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if grep -q "PILOTBASE_READY" "$RUNNER_TEMP/sidecar.log" 2>/dev/null; then break; fi
            sleep 1
          done
          PORT=$(grep -oE 'PILOTBASE_READY port=[0-9]+' "$RUNNER_TEMP/sidecar.log" | grep -oE '[0-9]+$' || true)
          test -n "$PORT" || { echo "sidecar did not become ready:"; cat "$RUNNER_TEMP/sidecar.log"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Pilotbase-Token: smoketest" "http://127.0.0.1:$PORT/api/v1/health")
          test "$CODE" = "200" || { echo "health check returned $CODE"; cat "$RUNNER_TEMP/sidecar.log"; exit 1; }
          kill $PID

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build Electron app
        working-directory: desktop
        env:
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || (startsWith(matrix.platform, 'mac') && secrets.CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || (startsWith(matrix.platform, 'mac') && secrets.CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Build only this runner's arch. The PyInstaller sidecar is host-arch
        # only, so the mac target in electron-builder.yml lists no arch: an
        # arch list there wins over this flag and packages this runner's
        # sidecar into the other arch's installer too.
        # Empty secrets still arrive as empty env vars, and electron-builder
        # resolves an empty CSC_LINK to the cwd ("not a file"), so drop them
        # to fall back to an unsigned build.
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # macOS needs these together: the Developer ID certificate, its
          # password and one complete notarization login (an App Store Connect
          # API key, or the Apple ID with an app-specific password). A signed
          # app that isn't notarized is still blocked by Gatekeeper, and a
          # certificate without its password fails the build, so with anything
          # missing build the ad-hoc signed app instead (scripts/after-pack.js).
          if [ "${{ startsWith(matrix.platform, 'mac') }}" = "true" ]; then
            MISSING=""
            for v in CSC_LINK CSC_KEY_PASSWORD; do
              if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
            done
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              # electron-builder takes the key as a file path, and prefers the
              # Apple ID login when both are present.
              echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            else
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
              for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
              done
            fi
            unset APPLE_API_KEY_P8
            if [ -z "$MISSING" ]; then
              echo "MAC_SIGNED=true" >> "$GITHUB_ENV"
            else
              echo "::warning::macOS build is ad-hoc signed, not notarized. Missing secrets:$MISSING"
              unset CSC_LINK CSC_KEY_PASSWORD
            fi
          fi
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npm run build -- ${{ matrix.arch }}

      # Never publish a DMG that won't open: check the image checksum, then
      # mount it and check the app's code signature (ad-hoc or Developer ID).
      # A Developer ID build must also be notarized with the ticket stapled and
      # pass Gatekeeper, and the sidecar must still start from inside the
      # signed bundle (hardened runtime).
      - name: Verify macOS disk images
        if: startsWith(matrix.platform, 'mac')
        shell: bash
        working-directory: desktop/release
        run: |
          set -e
          for dmg in *.dmg; do
            hdiutil verify "$dmg"
            MNT=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$dmg"
            codesign --verify --deep --strict --verbose=2 "$MNT/Pilotbase.app"
            codesign -dv --verbose=2 "$MNT/Pilotbase.app" 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
            if [ "$MAC_SIGNED" = "true" ]; then
              codesign -dv --verbose=2 "$MNT/Pilotbase.app" 2>&1 | grep -q "Authority=Developer ID Application"
              xcrun stapler validate "$MNT/Pilotbase.app"
              spctl --assess --type execute --verbose=2 "$MNT/Pilotbase.app" 2>&1 | tee "$RUNNER_TEMP/spctl.log"
              grep -q "Notarized Developer ID" "$RUNNER_TEMP/spctl.log"
            fi
            export ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
            export SECRET_KEY=smoketest-secret
            LOG="$RUNNER_TEMP/sidecar-dmg.log"
            : > "$LOG"
            "$MNT/Pilotbase.app/Contents/Resources/sidecar/pilotbase-api" --host 127.0.0.1 --port 0 --token smoketest --data-dir "$RUNNER_TEMP/pb-data-dmg" > "$LOG" 2>&1 &
            PID=$!
            for i in $(seq 1 30); do
              if grep -q "PILOTBASE_READY" "$LOG" 2>/dev/null; then break; fi
              sleep 1
            done
            grep -q "PILOTBASE_READY" "$LOG" || { echo "sidecar in $dmg did not start:"; cat "$LOG"; kill $PID 2>/dev/null || true; hdiutil detach -force "$MNT"; exit 1; }
            kill $PID
            wait $PID 2>/dev/null || true
            hdiutil detach "$MNT"
          done

      # Only the distributables. desktop/release/ also holds win-unpacked/,
      # builder-debug.yml, builder-effective-config.yaml and .blockmap files,
      # none of which belong on a public release.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pilotbase-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            !desktop/release/__uninstaller-*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    # Creating/updating a Release needs write access; GITHUB_TOKEN is read-only
    # by default. Scoped to this job so the build matrix stays read-only.
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One publish after all four builds succeed, rather than four jobs racing
      # to create the same release.
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
