appId: com.pilotbase.desktop
productName: Pilotbase
icon: resources/icon.png
directories: { output: release, buildResources: resources }
files: ["dist/**", "resources/ad/**", "package.json"]
extraResources:
  - { from: "../api/dist/pilotbase-api", to: "sidecar", filter: ["**/*"] }
  - { from: "resources/splash", to: "splash", filter: ["**/*"] }
  - { from: "resources/icon.png", to: "icon.png" }
asar: true
afterPack: scripts/after-pack.js
win:   { target: [{ target: nsis, arch: [x64] }], artifactName: "Pilotbase-Setup-${version}-win-x64.exe" }
nsis:  { oneClick: true, perMachine: false }
mac:   { target: [dmg], category: public.app-category.developer-tools,
         hardenedRuntime: true, entitlements: resources/entitlements.plist,
         entitlementsInherit: resources/entitlements.plist, notarize: true,
         artifactName: "Pilotbase-${version}-mac-${arch}.dmg" }
# Mac App Store build (scripts/build-mas.sh): sandboxed, no hardened runtime or
# notarization; the PyInstaller sidecar runs inside the app's sandbox
# (entitlementsInherit). Signed with the Mac App Distribution identity from the
# keychain, packaged as a .pkg with the Mac Installer Distribution identity.
mas:  { hardenedRuntime: false, entitlements: resources/entitlements.mas.plist,
        entitlementsInherit: resources/entitlements.mas.inherit.plist,
        entitlementsLoginHelper: resources/entitlements.mas.inherit.plist,
        notarize: false, minimumSystemVersion: "12.0",
        # Sign only the sidecar's Mach-O files (pilotbase-api, Python, .so,
        # .dylib); its ~3,000 data files are sealed by the app signature.
        signIgnore: ['/sidecar/(?!.*\.(so|dylib)$)(?!pilotbase-api$)(?!.*/Python$).+'],
        artifactName: "Pilotbase-${version}-mas-${arch}.pkg" }
linux: { target: [{ target: AppImage, arch: [x64] }], category: Development, artifactName: "Pilotbase-${version}-linux-x64.AppImage" }
publish: null
