version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pilotbase_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pilotbase
      POSTGRES_USER: pilotbase
      POSTGRES_PASSWORD: pilotbase_secret
    volumes:
      - pilotbase_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotbase"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilotbase_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      # Everything else (SECRET_KEY, ENCRYPTION_KEY, OLLAMA_*, AUTH_BACKEND,
      # CORS_ORIGINS, ENVIRONMENT, DB_CONNECT_TIMEOUT_SECONDS) is read from
      # here. Copy api/.env.example to api/.env and edit it before your first
      # `docker compose up --build` — see docs/installation.md.
      - api/.env
    environment:
      # These four are fixed by this Compose topology and always override
      # whatever is set in api/.env — do not change them there.
      # Pilotbase internal database — must use the `db` service name, not
      # localhost, since the app container reaches Postgres over the Compose
      # network.
      DATABASE_URL: "postgresql+psycopg2://pilotbase:pilotbase_secret@db:5432/pilotbase"
      # Must match the `ports:` mapping below and the healthcheck.
      PORT: "8000"
      STATIC_DIR: "/app/api/static"
      # Where database backups are written inside the container. If you change
      # this, update the volume mount below to match, then restart with
      # `docker compose up -d --build` — otherwise backups won't persist
      # across container rebuilds. See docs/installation.md.
      BACKUPS_DIR: "/app/api/backups"

    volumes:
      - pilotbase_backups:/app/api/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  pilotbase_pgdata:
  pilotbase_backups:
